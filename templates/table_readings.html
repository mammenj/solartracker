<table class="w-full text-left text-xs text-slate-300">
  <thead class="sticky top-0 bg-slate-950 border-b border-slate-800 text-slate-400 z-10">
    <tr>
      <th class="p-3">Date</th>
      <th class="p-3">Solar Gen</th>
      <th class="p-3">Export</th>
      <th class="p-3">Import</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-800/50">
    % for r in readings:
    <tr class="hover:bg-slate-800/30 transition-colors">
      <td class="p-3 font-medium text-slate-200">
        {{r.date.strftime('%d/%m/%Y')}}
      </td>
      <td class="p-3 text-amber-400 font-mono">
        {{f"{r.solar_units:.2f}"}} kWh
      </td>
      <td class="p-3 text-emerald-400 font-mono">
        {{f"{r.export_units:.2f}"}} kWh
      </td>
      <td class="p-3 text-red-400 font-mono">
        {{f"{r.import_units:.2f}"}} kWh
      </td>
    </tr>
    % end
    % if not readings:
    <tr>
      <td colspan="4" class="p-6 text-center text-slate-500">
        No readings logged yet.
      </td>
    </tr>
    % end
  </tbody>
</table>
