# Casbin model for Solar Tracker.
#
# This file defines the shape of the authorization policy. The policy itself
# (who may do what, and each role's home page) lives in policy.csv.
#
# Edit policy.csv to change access rules; only edit this file when the shape
# of the policy needs to change.

[request_definition]
r = sub, obj, act

[policy_definition]
# Permission rules: p, <role>, <resource>, <action>
p = sub, obj, act

# Landing-page rules: p2, <role>, <home-path>
p2 = sub, home

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (r.sub == p.sub || g(r.sub, p.sub)) && r.obj == p.obj && r.act == p.act
